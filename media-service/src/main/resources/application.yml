server:
  port: 8083

spring:
  application:
    name: media-service

riskyc:
  cors:
    # The web chat client's origin(s), comma-separated — see WebConfig. Same
    # default/key name as auth-service's own riskyc.cors.allowed-origins.
    allowed-origins: ${RISKYC_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://167.86.120.214:8085}
  minio:
    endpoint: ${RISKYC_MINIO_ENDPOINT:http://localhost:9000}
    # Baked into presigned URLs — must be reachable from the mobile client,
    # not just from inside the Docker network. Override with your machine's
    # LAN IP when testing on a physical device.
    public-endpoint: ${RISKYC_MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: riskyc
    secret-key: riskyc-secret
    bucket: riskyc-media
    # Pinned explicitly so the MinIO SDK never has to auto-discover it via a
    # GetBucketLocation bootstrap call — that call signs with a hardcoded
    # "us-east-1" credential scope regardless of this setting, but skipping
    # it entirely avoids a signature mismatch we hit once media-service's
    # presigning client started talking to MinIO through an HTTPS reverse
    # proxy instead of directly (mc's own equivalent discovery worked fine
    # over the same proxy, isolating the bug to the Java SDK's bootstrap
    # path specifically, not the proxy or MinIO's own config). Matches
    # MinIO's own default effective region since RISKYC_MINIO_REGION /
    # MINIO_REGION aren't set on the server either.
    region: ${RISKYC_MINIO_REGION:us-east-1}
