# Isolation from any other stack already running on the same host: Compose
# scopes container names, the bridge network, and volumes to this project
# (named after the directory this file lives in — e.g. "riskyc-chat-backend"
# on the VPS, distinct from "riskyc-backend"/"riskyc-frontend"), and nothing
# here joins an external/shared network — so these containers have no path
# to reach, or be reached by, another stack's containers. The only possible
# collision is a host port already bound by something else, which fails the
# affected container's startup loudly (address already in use) rather than
# causing any cross-talk. Default ports below are already shifted off
# whatever `docker ps` showed taken on the target VPS (riskyc-backend,
# riskyc-frontend, nguon-app, jitsi) — see .env.example for the exact list
# and how to override further if a different host needs it. One exception:
# coturn runs with network_mode: host (required for TURN's dynamically
# allocated relay ports to work correctly through Docker at all) — it binds
# straight to host ports rather than being published through the bridge
# network like everything else here, but the "loud failure, not silent
# conflict" guarantee on a taken port still holds either way.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: riskyc
      POSTGRES_PASSWORD: riskyc
      POSTGRES_DB: riskyc
    # Bound to loopback only — every service reaches postgres over the
    # internal docker network by hostname, so a public port isn't needed;
    # 127.0.0.1 still lets you `psql` from the host itself (or an SSH
    # tunnel) without exposing the DB to the internet.
    ports:
      # Default host port shifted off 5432: the VPS this ships to already has
      # another Postgres container bound to 0.0.0.0:5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: riskyc
      MINIO_ROOT_PASSWORD: riskyc-secret
    ports:
      # 9000/9001 shifted off their usual defaults: the VPS this ships to
      # already has another MinIO container bound to those exact host ports.
      # API (9010) stays public — media-service hands out presigned URLs
      # against it directly, so the mobile client must be able to reach it.
      # Console (9011) has no reason to be public.
      - "${MINIO_API_HOST_PORT:-9010}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9011}:9001"
    volumes:
      - minio-data:/data

  auth-service:
    # Build context is the backend root, not ./auth-service, because the
    # Dockerfile's Maven build needs the sibling `common` module too
    # (multi-module reactor build) — see auth-service/Dockerfile.
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      # 8081 shifted to 8091: already bound by another container on this VPS.
      - "${AUTH_SERVICE_HOST_PORT:-8091}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/riskyc
      RISKYC_MAIL_HOST: ${RISKYC_MAIL_HOST:-smtp.gmail.com}
      RISKYC_MAIL_PORT: ${RISKYC_MAIL_PORT:-587}
      RISKYC_MAIL_USERNAME: ${RISKYC_MAIL_USERNAME:-}
      RISKYC_MAIL_PASSWORD: ${RISKYC_MAIL_PASSWORD:-}
      RISKYC_MAIL_FROM: ${RISKYC_MAIL_FROM:-}
      RISKYC_BIRD_API_KEY: ${RISKYC_BIRD_API_KEY:-}
      RISKYC_BIRD_API_BASE_URL: ${RISKYC_BIRD_API_BASE_URL:-https://us1.platform.bird.com}
      RISKYC_SMS_SENDER: ${RISKYC_SMS_SENDER:-RiskyC}
      RISKYC_CORS_ALLOWED_ORIGINS: ${RISKYC_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://167.86.120.214:8085,https://chat.riskycfashion.com}
      RISKYC_INTERNAL_API_KEY: ${RISKYC_INTERNAL_API_KEY:-}
      RISKYC_SYSTEM_ACCOUNT_ACCESS_EMAIL: ${RISKYC_SYSTEM_ACCOUNT_ACCESS_EMAIL:-}
      RISKYC_SYSTEM_ACCOUNT_DISPLAY_NAME: ${RISKYC_SYSTEM_ACCOUNT_DISPLAY_NAME:-RiskyC Fashion}
      RISKYC_SYSTEM_ACCOUNT_WELCOME_MESSAGE: ${RISKYC_SYSTEM_ACCOUNT_WELCOME_MESSAGE:-Welcome to RiskyC Chat! We're glad you're here.}
      RISKYC_SYSTEM_ACCOUNT_DESCRIPTION: ${RISKYC_SYSTEM_ACCOUNT_DESCRIPTION:-}
      RISKYC_SYSTEM_ACCOUNT_WEBSITE_URL: ${RISKYC_SYSTEM_ACCOUNT_WEBSITE_URL:-}
      RISKYC_MESSAGING_SERVICE_INTERNAL_URL: ${RISKYC_MESSAGING_SERVICE_INTERNAL_URL:-http://messaging-service:8082}
      # Blank by default (no update prompt) until deliberately set after a
      # new Play Store release — see AppVersionController's own comment.
      RISKYC_LATEST_ANDROID_VERSION: ${RISKYC_LATEST_ANDROID_VERSION:-}
      RISKYC_MIN_SUPPORTED_ANDROID_VERSION: ${RISKYC_MIN_SUPPORTED_ANDROID_VERSION:-}
    depends_on:
      - postgres

  messaging-service:
    build:
      context: .
      dockerfile: messaging-service/Dockerfile
    ports:
      # 8082 shifted to 8092: already bound by another container on this VPS.
      - "${MESSAGING_SERVICE_HOST_PORT:-8092}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/riskyc
      SPRING_DATA_REDIS_HOST: redis
      RISKYC_CORS_ALLOWED_ORIGINS: ${RISKYC_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://167.86.120.214:8085,https://chat.riskycfashion.com}
      RISKYC_INTERNAL_API_KEY: ${RISKYC_INTERNAL_API_KEY:-}
      RISKYC_AUTH_SERVICE_INTERNAL_URL: ${RISKYC_AUTH_SERVICE_INTERNAL_URL:-http://auth-service:8081}
    depends_on:
      - postgres
      - redis

  media-service:
    build:
      context: .
      dockerfile: media-service/Dockerfile
    ports:
      - "${MEDIA_SERVICE_HOST_PORT:-8083}:8083"
    environment:
      RISKYC_MINIO_ENDPOINT: http://minio:9000
      RISKYC_MINIO_PUBLIC_ENDPOINT: ${RISKYC_MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      RISKYC_CORS_ALLOWED_ORIGINS: ${RISKYC_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://167.86.120.214:8085,https://chat.riskycfashion.com}
    depends_on:
      - minio

  presence-service:
    build:
      context: .
      dockerfile: presence-service/Dockerfile
    ports:
      - "${PRESENCE_SERVICE_HOST_PORT:-8084}:8084"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      RISKYC_CORS_ALLOWED_ORIGINS: ${RISKYC_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://167.86.120.214:8085,https://chat.riskycfashion.com}
    depends_on:
      - redis

  # TURN relay for calling: public STUN alone often can't establish a P2P
  # media path once caller and callee are on genuinely different networks
  # (mobile data + carrier-grade NAT is the classic failure case) — the call
  # "connects" at the signaling layer, but no audio/video ever arrives
  # because no ICE candidate pair ever actually works. TURN relays the media
  # through this server instead when a direct path can't be found. Static
  # long-lived username/password (not the more common time-limited HMAC
  # secret) for now — simple, and adequate for an app already documented as
  # pre-hardening (plain HTTP, no E2E encryption yet); anyone who decompiles
  # the APK gets a relay-only credential, not access to anything sensitive.
  coturn:
    image: coturn/coturn:latest
    network_mode: host
    command:
      - -n
      - --listening-port=${TURN_PORT:-3478}
      - --realm=riskyc.chat
      - --user=${TURN_USERNAME:-riskyc}:${TURN_PASSWORD:-riskyc-turn-secret}
      - --external-ip=${TURN_EXTERNAL_IP:-167.86.120.214}
      - --min-port=${TURN_RELAY_MIN_PORT:-49160}
      - --max-port=${TURN_RELAY_MAX_PORT:-49200}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers

  # Group-calling SFU (mediasoup) — see backend/sfu-service/ for the full
  # writeup. network_mode: host for the same reason as coturn above: the
  # mediasoup WebRtcServer's UDP/TCP ports must be directly reachable, not
  # NAT'd through Docker's bridge. One consequence: unlike every other
  # service here, this container does NOT sit on the compose bridge network,
  # so it reaches auth-service/messaging-service via their HOST-mapped ports
  # (127.0.0.1:8091/:8092) rather than internal Docker hostnames the way
  # RevokedJtiCache.java does — the defaults below reflect that; if you ever
  # override RISKYC_AUTH_SERVICE_INTERNAL_URL / RISKYC_MESSAGING_SERVICE_INTERNAL_URL
  # for messaging-service's own use, remember sfu-service needs a
  # host-reachable value, not an internal-hostname one.
  sfu-service:
    build:
      context: ./sfu-service
    network_mode: host
    environment:
      SFU_PORT: ${SFU_SERVICE_HOST_PORT:-8095}
      SFU_ANNOUNCED_IP: ${TURN_EXTERNAL_IP:-167.86.120.214}
      SFU_WEBRTC_SERVER_PORT_BASE: ${SFU_WEBRTC_PORT_BASE:-50000}
      SFU_WORKER_COUNT: ${SFU_WORKER_COUNT:-2}
      RISKYC_JWT_SECRET: ${RISKYC_JWT_SECRET:-ZmFrZS1kZXYtc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZC1wbGVhc2UtY2hhbmdlLW1l}
      RISKYC_INTERNAL_API_KEY: ${RISKYC_INTERNAL_API_KEY:-}
      RISKYC_AUTH_SERVICE_INTERNAL_URL: ${RISKYC_AUTH_SERVICE_INTERNAL_URL:-http://127.0.0.1:8091}
      RISKYC_MESSAGING_SERVICE_INTERNAL_URL: ${RISKYC_MESSAGING_SERVICE_INTERNAL_URL:-http://127.0.0.1:8092}
      RISKYC_TURN_SERVER_URL: turn:${TURN_EXTERNAL_IP:-167.86.120.214}:${TURN_PORT:-3478}
      RISKYC_TURN_USERNAME: ${TURN_USERNAME:-riskyc}
      RISKYC_TURN_CREDENTIAL: ${TURN_PASSWORD:-riskyc-turn-secret}
    depends_on:
      - auth-service
      - messaging-service

volumes:
  postgres-data:
  minio-data:
