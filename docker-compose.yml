services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: riskyc
      POSTGRES_PASSWORD: riskyc
      POSTGRES_DB: riskyc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: riskyc
      MINIO_ROOT_PASSWORD: riskyc-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  auth-service:
    build: ./auth-service
    ports:
      - "${AUTH_SERVICE_HOST_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/riskyc
      RISKYC_MAIL_HOST: ${RISKYC_MAIL_HOST:-smtp.gmail.com}
      RISKYC_MAIL_PORT: ${RISKYC_MAIL_PORT:-587}
      RISKYC_MAIL_USERNAME: ${RISKYC_MAIL_USERNAME:-}
      RISKYC_MAIL_PASSWORD: ${RISKYC_MAIL_PASSWORD:-}
      RISKYC_MAIL_FROM: ${RISKYC_MAIL_FROM:-}
    depends_on:
      - postgres

  messaging-service:
    build: ./messaging-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/riskyc
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

  media-service:
    build: ./media-service
    ports:
      - "8083:8083"
    environment:
      RISKYC_MINIO_ENDPOINT: http://minio:9000
      RISKYC_MINIO_PUBLIC_ENDPOINT: ${RISKYC_MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
    depends_on:
      - minio

  presence-service:
    build: ./presence-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      - redis

volumes:
  postgres-data:
  minio-data:
