server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/riskyc
    username: riskyc
    password: riskyc
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${RISKYC_MAIL_HOST:smtp.gmail.com}
    port: ${RISKYC_MAIL_PORT:587}
    username: ${RISKYC_MAIL_USERNAME:}
    password: ${RISKYC_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

riskyc:
  jwt:
    # Local-dev-only secret. Provide via env var / secret manager in real deployments.
    secret: ${RISKYC_JWT_SECRET:ZmFrZS1kZXYtc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZC1wbGVhc2UtY2hhbmdlLW1l}
  mail:
    # The address OTP emails are sent from — usually the same as spring.mail.username.
    from: ${RISKYC_MAIL_FROM:${RISKYC_MAIL_USERNAME:}}
  cors:
    # The web sign-in form's origin(s), comma-separated — see WebConfig.
    # Defaults cover local Vite dev (5173) and the VPS's web container port.
    allowed-origins: ${RISKYC_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://167.86.120.214:8085}
  internal:
    # Shared secret for service-to-service calls (messaging-service's
    # RevokedJtiCache polling /internal/sessions/revoked-jtis) — blank
    # disables the check for local dev, same blank-default pattern already
    # used for the SMS/mail credentials below.
    api-key: ${RISKYC_INTERNAL_API_KEY:}
  app-version:
    # Bumped manually (env var, no redeploy of app code needed) each time a
    # new build is published to the Play Store — lets the mobile app prompt
    # to update instead of relying solely on the Play Store's own auto-update,
    # which a user can have disabled or delayed. Blank means "no check" —
    # the mobile client never prompts when either value is unset, so this
    # is safe to leave unconfigured until someone deliberately turns it on.
    latest-android: ${RISKYC_LATEST_ANDROID_VERSION:}
    min-supported-android: ${RISKYC_MIN_SUPPORTED_ANDROID_VERSION:}
  system-account:
    # A special identifier that, when submitted as the "email" to
    # POST /api/auth/otp/request, logs straight into the RiskyC Fashion
    # system account — no code sent, no Bird/SMTP call made at all. This is
    # the account every new user gets an automatic welcome message from
    # (see AuthController's new-user branch) and the one used to post any
    # future official announcements. Blank disables the whole feature: every
    # identifier is then handled by the normal OTP flow, same as before this
    # existed. Should be a long random value kept secret out-of-band (not
    # committed anywhere), formatted like an email address so it passes the
    # client's own identifier validation without any special-casing there.
    access-email: ${RISKYC_SYSTEM_ACCOUNT_ACCESS_EMAIL:}
    display-name: ${RISKYC_SYSTEM_ACCOUNT_DISPLAY_NAME:RiskyC Fashion}
    # This account is broadcast-only (see SystemAccountController#broadcast
    # and the mobile client's read-only composer for it) — the default copy
    # deliberately doesn't invite a reply the way an earlier version of this
    # message did, since one is no longer possible.
    welcome-message: ${RISKYC_SYSTEM_ACCOUNT_WELCOME_MESSAGE:Welcome to RiskyC Chat! We're glad you're here.}
    # Shown on this account's "details" page in the client (see
    # SystemAccountInfoController#get) — a short description and a website
    # link, the same two things WhatsApp's own official/business accounts
    # show. Both blank by default; the client shows the section only when
    # at least one is set.
    description: ${RISKYC_SYSTEM_ACCOUNT_DESCRIPTION:}
    website-url: ${RISKYC_SYSTEM_ACCOUNT_WEBSITE_URL:}
  messaging-service:
    # First time auth-service calls OUT to messaging-service (every other
    # cross-service call in this codebase goes the other direction) — only
    # used to deliver the new-account welcome message. Same internal-network
    # hostname convention as messaging-service's own riskyc.auth-service.internal-url.
    internal-url: ${RISKYC_MESSAGING_SERVICE_INTERNAL_URL:http://messaging-service:8082}
  sms:
    # See backend/README.md for how to get these from the Bird dashboard.
    # Left blank, SmsOtpSender falls back to logging instead of sending
    # (dev/local use only) rather than attempting a doomed call.
    bird-api-key: ${RISKYC_BIRD_API_KEY:}
    # Must match the API key's region (bk_us1_... -> us1, bk_eu1_... -> eu1).
    bird-api-base-url: ${RISKYC_BIRD_API_BASE_URL:https://us1.platform.bird.com}
    # Alphanumeric sender ID shown to the recipient — not supported for
    # every destination country (the US notably doesn't support them at
    # all), and some countries require it to be pre-registered with Bird.
    # See backend/README.md.
    sender: ${RISKYC_SMS_SENDER:RiskyC}
