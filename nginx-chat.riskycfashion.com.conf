# DISTRIBUTION COPY, same reasoning as riskyc-deploy.sh's own header: this
# rides into the server via `git pull` on this repo, then gets copied into
# place — it doesn't run from here.
#
# Install:
#   sudo cp nginx-chat.riskycfashion.com.conf /etc/nginx/sites-available/chat.riskycfashion.com
#   sudo ln -s /etc/nginx/sites-available/chat.riskycfashion.com /etc/nginx/sites-enabled/chat.riskycfashion.com
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d chat.riskycfashion.com
#
# certbot rewrites this file in place to add the `listen 443 ssl` block and
# the plain-80 redirect, exactly like it already did for
# /etc/nginx/sites-available/riskycfashion.com — don't hand-add SSL
# directives here, let certbot do it the same way it did for the others.
#
# Path layout — everything under one subdomain/cert, proxied by prefix to
# each of this app's own backend containers (all bound to 127.0.0.1 by
# docker-compose's port mappings, same as this box's other proxied apps):
#   /              -> web frontend container      (127.0.0.1:8085)
#   /auth/         -> auth-service                 (127.0.0.1:8091)
#   /messaging/    -> messaging-service, incl. WS   (127.0.0.1:8092)
#   /media/        -> media-service                 (127.0.0.1:8083)
#   /presence/     -> presence-service               (127.0.0.1:8084)
#   /sfu/          -> sfu-service (group calls), WS  (127.0.0.1:8095)
#
# sfu-service's protoo signaling handshake requires the 'protoo' WS
# subprotocol (Sec-WebSocket-Protocol header) — nginx forwards that header
# through unchanged by default, same as it does for /messaging/'s WS upgrade,
# no extra directive needed for it specifically.
#
# MinIO (actual file bytes, via presigned URLs media-service hands back) is
# deliberately NOT proxied here — it keeps using whatever
# RISKYC_MINIO_PUBLIC_ENDPOINT is already configured to, unchanged. Only
# media-service's own small JSON REST API (upload-url/download-url requests)
# goes through /media/ above.
server {
    listen 80;
    server_name chat.riskycfashion.com;

    location /auth/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /messaging/ {
        proxy_pass http://127.0.0.1:8092/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /presence/ {
        proxy_pass http://127.0.0.1:8084/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sfu/ {
        proxy_pass http://127.0.0.1:8095/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
